services:
  redis:
    image: redis:7-alpine
    container_name: library-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: library-rabbitmq
    # RabbitMQ keeps its data per node name, so the name must not change between restarts
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      # Durable order queues survive a restart of the broker
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  # REST API (Jersey on Tomcat 9): http://localhost:8080/LibraryServer/api/
  library-server:
    build:
      context: .
      dockerfile: LibraryServer/Dockerfile
    container_name: library-server
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      # Staff account used by the Library app; set your own in .env (see .env.example)
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      # Signs session tokens; empty = random per start, so everyone logs in again after a restart
      JWT_SECRET: ${JWT_SECRET:-}
      # Optional: lets the server e-mail books to members
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    volumes:
      - library-users:/usr/local/tomcat/USERS_FOLDER

volumes:
  redis-data:
  rabbitmq-data:
  library-users:
