# LibraryServer configuration.
# Every key can be overridden by an environment variable with the same name,
# e.g. MAIL_USERNAME / MAIL_PASSWORD / REDIS_HOST. Never commit real credentials here.
LOG_DIR=log
LOG_FILE=logs.log
BOOK_EXT=.txt
ZIP_FOLDER=ZIP_FOLDER
USERS_FOLDER=USERS_FOLDER
USERS_FILE=users.xml
REDIS_HOST=localhost
REDIS_PORT=6379
BOOK_KEY_PREFIX=book:
PREVIEW_LINES=100
START_MARKER=*** START OF THE PROJECT GUTENBERG EBOOK
MAIL_HOST=smtp.gmail.com
MAIL_PORT=587
MAIL_USERNAME=
MAIL_PASSWORD=
ADMIN_USERNAME=admin
# Required: the Library app logs in with these. Set ADMIN_PASSWORD in the environment.
ADMIN_PASSWORD=
# Signs session tokens. Empty = a random secret per start (everyone logs in again after a restart)
JWT_SECRET=
TOKEN_TTL_MINUTES=480
# PBKDF2-HMAC-SHA256 work factor (OWASP 2023 recommendation)
PASSWORD_HASH_ITERATIONS=600000
RESERVATION_KEY_PREFIX=reservation:
